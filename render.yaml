# Render Blueprint — deploys the Yield2Pay backend (NestJS API) + a managed
# Postgres. In Render: New > Blueprint, point at this repo. Set the secret env
# vars (marked sync:false) in the dashboard after the first deploy.
# Frontend is deployed separately on Vercel (see docs/DEPLOY.md).
databases:
  - name: yield2pay-db
    plan: free
    databaseName: yield2pay
    user: yield2pay

services:
  - type: web
    name: yield2pay-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      # Render injects PORT automatically; the app reads process.env.PORT.
      - key: DATABASE_URL
        fromDatabase:
          name: yield2pay-db
          property: connectionString
      - key: SOLANA_CLUSTER
        value: devnet
      # Ambiente lógico. Em homologação use 'staging' para a resposta de erro
      # trazer technicalDetails; em produção deixe 'production'.
      - key: APP_ENV
        value: staging
      - key: SOLANA_RPC_URL
        value: https://api.devnet.solana.com
      # Moeda de depósito. Devnet usa VAULT_PROVIDER=mock (abaixo) — este valor
      # precisa ser o mint de "Real de teste" impresso por
      # apps/api/scripts/create-mock-devnet-mints.cjs, não USDC de verdade.
      - key: USDC_MINT
        sync: false
      # 'mock' porque a Kamino não tem oracle Scope em devnet — ver
      # docs/superpowers/plans/2026-09-04-mock-vault-devnet.md. Trocar para
      # 'kamino' exige mainnet ou o ambiente de staging da Kamino.
      - key: VAULT_PROVIDER
        value: mock
      # Só usado quando VAULT_PROVIDER=mock — mesmo script de cima cria os dois.
      - key: MOCK_VAULT_SHARE_MINT
        sync: false
      # Set this to your deployed web origin (Vercel), e.g. https://yield2pay.vercel.app
      - key: CORS_ORIGIN
        sync: false
      # Secrets — set in the Render dashboard (never commit real values):
      - key: PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
      - key: KAMINO_MARKET_ADDRESS
        sync: false
      - key: KAMINO_RESERVE_ADDRESS
        sync: false
      - key: FEE_SPONSOR_SECRET_KEY
        sync: false
